[project]
name = "fodgate"
version = "0.1.0"
description = "Airline gate FOD inspection PoC: backend (pipeline, workflow, API)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
# Optional DINOv2 patch-anomaly proposer (night / low-contrast Angles). The app runs without it.
dino = ["torch>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fodgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
